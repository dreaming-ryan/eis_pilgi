<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230F766E'/><text x='50' y='68' text-anchor='middle' font-size='56' font-family='serif' font-weight='700' fill='%23fff'>필</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>산업안전기사 필기 — 회차별 기출문제</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F7F2;--surface:#FFFFFF;--border:#D8E4D4;
  --text-main:#1A1F18;--text-sub:#506047;--text-muted:#8FA886;
  --point:#0F766E;--point-l:#E0F5F2;--point-d:#0B5C55;
  --r-lg:20px;--r-md:14px;
  --sh-sm:0 1px 4px rgba(28,26,22,.06);--sh-lg:0 12px 40px rgba(28,26,22,.12)
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;align-items:center}
.site-header{width:100%;padding:1.5rem 2rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-icon{width:34px;height:34px;background:var(--point);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}
.logo-text{font-size:15px;font-weight:600;color:var(--text-main);letter-spacing:-.02em}
.logo-text span{color:var(--point)}
.back-btn{font-size:13px;color:var(--text-sub);text-decoration:none;padding:6px 14px;border-radius:20px;background:var(--bg);border:1px solid var(--border);transition:all .15s}
.back-btn:hover{background:var(--point-l);color:var(--point);border-color:var(--point-l)}
.main{width:100%;max-width:680px;padding:2.5rem 1.5rem 6rem;flex:1}
.page-title{text-align:center;margin-bottom:2rem;animation:fadeUp .5s ease both}
.page-title h1{font-size:clamp(22px,4vw,28px);font-weight:700;letter-spacing:-.03em;line-height:1.4;margin-bottom:.6rem}
.page-title h1 em{color:var(--point);font-style:normal}
.page-title p{font-size:14px;color:var(--text-sub);line-height:1.65}
.year-section{margin-bottom:2rem;animation:fadeUp .6s .1s ease both}
.year-label{font-size:14px;font-weight:700;color:var(--point);margin-bottom:.9rem;display:flex;align-items:center;gap:8px}
.year-label::before{content:'';width:4px;height:14px;background:var(--point);border-radius:2px}
.round-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.round-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:1.1rem .9rem;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .18s ease;box-shadow:var(--sh-sm)}
.round-card:hover{border-color:var(--point);transform:translateY(-2px);box-shadow:var(--sh-lg);background:var(--point-l)}
.round-num{font-size:22px;font-weight:700;color:var(--text-main);letter-spacing:-.03em;line-height:1}
.round-card:hover .round-num{color:var(--point)}
.round-label{font-size:11px;color:var(--text-muted);font-weight:500}
.round-count{font-size:10px;color:var(--text-muted);background:var(--bg);padding:2px 8px;border-radius:10px;margin-top:2px}
.round-card:hover .round-count{background:#fff}
.notice{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:1.1rem 1.4rem;display:flex;gap:12px;align-items:flex-start;margin-top:2rem;animation:fadeUp .6s .25s ease both}
.notice-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.notice-text{font-size:12px;color:var(--text-sub);line-height:1.65}
.notice-text strong{color:var(--text-main);font-weight:600}
.pdf-btn-wrap{display:flex;justify-content:center;margin-bottom:2rem;animation:fadeUp .5s .08s ease both}
.pdf-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 32px;border-radius:50px;background:linear-gradient(135deg,#0F766E 0%,#0B5C55 100%);color:#fff;font-size:15px;font-weight:700;text-decoration:none;letter-spacing:-.02em;box-shadow:0 4px 18px rgba(15,118,110,.38);transition:all .22s ease;white-space:nowrap}
.pdf-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(15,118,110,.50);filter:brightness(1.07)}
.pdf-btn:active{transform:translateY(0);box-shadow:0 3px 10px rgba(15,118,110,.30)}
.pdf-btn-icon{font-size:18px;line-height:1;flex-shrink:0}
.footer{text-align:center;font-size:12px;color:var(--text-muted);padding:1.5rem;border-top:1px solid var(--border);width:100%}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){
  .round-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .round-num{font-size:19px}
  .site-header{padding:1.2rem 1rem}
}
</style>
</head>
<body>
<header class="site-header">
  <a class="logo" href="index.html">
    <div class="logo-icon">📚</div>
    <div class="logo-text">산안기 <span>필기</span> 기출문제</div>
  </a>
  <a class="back-btn" href="index.html">← 메인으로</a>
</header>

<main class="main">
  <div class="page-title">
    <h1>회차별 <em>기출문제</em> 풀기</h1>
    <p id="page-desc">풀고 싶은 회차를 선택하면 해당 회차 120문항이<br>실제 시험 순서대로 출제됩니다.</p>
  </div>

  <div class="pdf-btn-wrap">
    <a class="pdf-btn"
       href="https://dreaming-ryan.com/home?product=%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EA%B8%B0%EC%82%AC%20%EC%9A%94%EC%95%BD%EB%85%B8%ED%8A%B8%20PDF%20(%ED%95%84%EA%B8%B0)"
       target="_blank"
       rel="noopener noreferrer">
      <span class="pdf-btn-icon">📙</span>
      <span style="display:flex;flex-direction:column;align-items:flex-start;gap:2px">
        <span>산안기 필기 요약노트 PDF</span>
        <span style="font-size:13px;font-weight:500;opacity:.9">무료 샘플 받기</span>
      </span>
    </a>
  </div>

  <div id="rounds-container"></div>

  <div class="notice">
    <span class="notice-icon">📝</span>
    <p class="notice-text" id="notice-text">
      <strong>회차별 학습</strong> &nbsp;각 회차는 6과목 × 20문항 = 총 120문항으로 구성되어 있어요.
      실제 시험과 동일한 형태로 풀어보면서 시간 분배 감각도 함께 익혀보세요.
    </p>
  </div>
</main>

<footer class="footer" id="footer-text">산업안전기사 필기 기출문제 학습 자료 · 17~22년</footer>

<script src="pilgi_stats.js"></script>
<script>
const SESSION_NAME = { 1: '1회', 2: '2회', 3: '3회' };

PilgiStats.load(stats => {
  const fmt = PilgiStats.fmtComma;

  // 1. ROUND_DATA를 stats.yearRounds에서 동적으로 생성 — 최신 연도부터 역순 정렬
  const ROUND_DATA = stats.years
    .slice()
    .sort((a, b) => parseInt(b) - parseInt(a))   // 최신 연도가 위로
    .map(yy => ({
      year: parseInt(yy),
      sessions: stats.yearRounds[yy].map(s => parseInt(s))
    }));

  // 2. 회차 카드 그리드 렌더링
  const container = document.getElementById('rounds-container');
  container.innerHTML = '';
  ROUND_DATA.forEach(({ year, sessions }) => {
    const section = document.createElement('div');
    section.className = 'year-section';

    const label = document.createElement('div');
    label.className = 'year-label';
    label.textContent = `20${year}년도`;
    section.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'round-grid';

    sessions.forEach(s => {
      const a = document.createElement('a');
      a.className = 'round-card';
      a.href = `sanup_safety_quiz.html?round=${year}-${s}`;

      const num = document.createElement('div');
      num.className = 'round-num';
      num.textContent = SESSION_NAME[s] || `${s}회`;
      a.appendChild(num);

      const lbl = document.createElement('div');
      lbl.className = 'round-label';
      lbl.textContent = `20${year}년`;
      a.appendChild(lbl);

      // 회차별 실제 문항 수
      const roundKey = `${year}-${s}`;
      const cntVal = stats.roundCounts[roundKey] || 0;
      const cnt = document.createElement('div');
      cnt.className = 'round-count';
      cnt.textContent = `${fmt(cntVal)}문항`;
      a.appendChild(cnt);

      grid.appendChild(a);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });

  // 3. 회차당 평균 문항 수 (안내 박스용)
  const avgPerRound = stats.totalRounds
    ? Math.round(stats.totalQ / stats.totalRounds)
    : 0;
  const perSubject = stats.totalSubjects ? Math.round(avgPerRound / stats.totalSubjects) : 0;

  // 4. 페이지 안내 문구
  const pageDesc = document.getElementById('page-desc');
  if (pageDesc) {
    pageDesc.innerHTML =
      `풀고 싶은 회차를 선택하면 해당 회차 ${fmt(avgPerRound)}문항이<br>` +
      `실제 시험 순서대로 출제됩니다.`;
  }

  // 5. 하단 안내 박스
  const noticeText = document.getElementById('notice-text');
  if (noticeText) {
    noticeText.innerHTML =
      `<strong>회차별 학습</strong> &nbsp;각 회차는 ${stats.totalSubjects}과목 × ${perSubject}문항 = ` +
      `총 ${fmt(avgPerRound)}문항으로 구성되어 있어요. ` +
      `실제 시험과 동일한 형태로 풀어보면서 시간 분배 감각도 함께 익혀보세요.`;
  }

  // 6. 푸터
  const footerText = document.getElementById('footer-text');
  if (footerText) {
    footerText.textContent = `산업안전기사 필기 기출문제 학습 자료 · ${stats.yearRangeText}`;
  }
});
</script>
</body>
</html>
